name: "Bug Report"
description: "Report an unexpected issue or system anomaly to maintain ecosystem stability."
title: "[BUG]: "
labels: ["bug"]
assignees:
  - "jeanlaris"
body:
  - type: markdown
    attributes:
      value: |
        🐛 **Anomaly Diagnostics Notice**
        
        🎯 **Objective:** Document technical flaws, unexpected behavior, or execution failures.
        ⚙️ **Execution:** Provide detailed reproduction steps and system state logs.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what went wrong and expected vs actual results..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List step-by-step instructions to replicate the behavior."
      placeholder: "1. Execute command...\n2. Observe error output..."
    validations:
      required: true
